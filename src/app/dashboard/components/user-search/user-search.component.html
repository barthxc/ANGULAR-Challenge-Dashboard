<form>
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input
      type="text"
      placeholder="nombre"
      aria-label="name"
      matInput
      [formControl]="searchControl"
      [matAutocomplete]="auto"
    />
    <mat-autocomplete #auto="matAutocomplete">
      <ng-container *ngIf="filteredUsers.length > 0; else noResults">
        <mat-option
          *ngFor="let user of filteredUsers"
          [value]="user.name"
          (onSelectionChange)="onUserSelected(user)"
        >
          {{ user.name }}
        </mat-option>
      </ng-container>
    </mat-autocomplete>
  </mat-form-field>
</form>

<ng-template #noResults>
  <mat-option disabled> No se encontraron resultados </mat-option>
</ng-template>
